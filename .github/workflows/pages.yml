# Deploy the vote page (site/) to GitHub Pages
# Author: Christoforos Pliatsikas
name: Deploy page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the page at the Worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::Repository variable WORKER_URL is not set. The page will load but cannot save votes."
            exit 0
          fi
          WORKER_URL="${WORKER_URL%/}"
          case "$WORKER_URL" in https://*) ;; *) echo "::error::WORKER_URL must start with https://"; exit 1;; esac
          printf '/* generated by the Pages workflow */\nwindow.CP_API = "%s";\n' "$WORKER_URL" > site/config.js
          # tighten the CSP from any *.workers.dev to exactly this Worker
          sed -i "s#connect-src https://\*\.workers\.dev#connect-src ${WORKER_URL}#" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
