# CP Lineup Vote - Cloudflare Worker config
# Author: Christoforos Pliatsikas
name = "cp-vote"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
MEMBERS = "kOsA,Ankalime,turambar,morrax,sinook,gx,morgx"
# Overwritten by the GitHub workflow from the PAGES_ORIGIN repo variable.
# Comma-separate more than one origin if needed.
ALLOWED_ORIGIN = "http://localhost:8000"

[[durable_objects.bindings]]
name = "STORE"
class_name = "VoteStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoteStore"]

[observability]
enabled = true
